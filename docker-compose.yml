services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_DATABASE: ${DB_NAME:-faifly}
      MYSQL_USER: ${DB_USER:-faifly}
      MYSQL_PASSWORD: ${DB_PASSWORD:-faifly}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${APP_PROFILE:-}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-faifly}
      DB_USER: ${DB_USER:-faifly}
      DB_PASSWORD: ${DB_PASSWORD:-faifly}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  mysql-data: